name: Recolector Automático TikTok

on:
  schedule:
    # Se ejecuta cada hora para conseguir la meta diaria de forma repartida y segura
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la página de GitHub cuando quieras

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script recolector
        run: python collector.py

      - name: Guardar cambios en la bodega (links.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Actualización automática de la bodega de enlaces [skip ci]"
          branch: principal
