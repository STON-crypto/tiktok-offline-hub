name: Recolector Automático TikTok

on:
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar colector
        run: python coleccionista.py

      - name: Guardar y actualizar enlaces en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add enlaces.json
          git commit -m "Actualización automática de enlaces de TikTok [skip ci]" || echo "No hay cambios para guardar"
          git push
